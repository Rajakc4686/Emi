<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Family Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        input, select, button { padding: 10px; margin: 5px; border-radius: 10px; border: 1px solid #ccc; }
        button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
        .income { background: #d1fae5; }
    </style>
</head>
<body>
<div class="card">
    <h2>📊 EMI குடும்ப பதிவு</h2>
    <p>சிங்கப்பூர் ⇄ இந்தியா</p>
</div>

<div class="card">
    <h3>➕ புதிய பதிவு</h3>
    <select id="typeSelect">
        <option value="income">💰 வருமானம்</option>
        <option value="emi">🏦 EMI</option>
    </select>
    <input type="text" id="month" placeholder="மாதம்" value="மே 2026">
    <input type="date" id="date">
    <input type="text" id="name" placeholder="பெயர் / வங்கி">
    <input type="number" id="amount" placeholder="தொகை">
    <input type="text" id="remain" placeholder="மீதி">
    <button id="saveBtn">சேமி</button>
    <button id="refreshBtn">புதுப்பிக்க</button>
</div>

<div class="card">
    <div id="totalBox"></div>
    <table id="dataTable">
        <thead><tr><th>வகை</th><th>மாதம்</th><th>தேதி</th><th>பெயர்</th><th>தொகை</th><th>மீதி</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="6">Loading...</td></tr></tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://onsnmatbyyvneobbnvmn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uc25tYXRieXl2bmVvYmJudm1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMTAwOTksImV4cCI6MjA5MTU4NjA5OX0.4CxM9cdf6BY92QGOeyUIvoA3RGgwDeTrlNjcYJXiFjY";
    
    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    async function loadData() {
        const { data, error } = await supabase.from('emi_records').select('*').order('created_at', {ascending: false});
        if(error) { document.getElementById('tableBody').innerHTML = `<tr><td colspan="6">Error: ${error.message}</td></tr>`; return; }
        let html = '';
        let totalIncome = 0, totalEMI = 0;
        for(let row of data) {
            const amt = Number(row.amount) || 0;
            if(row.type === 'income') totalIncome += amt;
            else totalEMI += amt;
            html += `<tr class="${row.type === 'income' ? 'income' : ''}">
                        <td>${row.type === 'income' ? '💰 வருமானம்' : '🏦 EMI'}</td>
                        <td>${row.month || ''}</td>
                        <td>${row.date || ''}</td>
                        <td>${row.name || ''}</td>
                        <td>₹${amt.toLocaleString('en-IN')}</td>
                        <td>${row.remain || '-'}</td>
                     </tr>`;
        }
        document.getElementById('tableBody').innerHTML = html;
        const balance = totalIncome - totalEMI;
        document.getElementById('totalBox').innerHTML = `<strong>💰 மொத்த வருமானம்: ₹${totalIncome.toLocaleString('en-IN')}</strong> | <strong>🏦 மொத்த EMI: ₹${totalEMI.toLocaleString('en-IN')}</strong> | <strong>${balance >=0 ? '✅ மிச்சம்' : '⚠️ பற்றாக்குறை'}: ₹${Math.abs(balance).toLocaleString('en-IN')}</strong>`;
    }
    
    async function saveRecord() {
        const type = document.getElementById('typeSelect').value;
        const month = document.getElementById('month').value;
        const date = document.getElementById('date').value;
        const name = document.getElementById('name').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const remain = document.getElementById('remain').value;
        if(!amount || isNaN(amount)) { alert("தொகை சரியில்லை"); return; }
        if(!name) { alert("பெயர் சரியில்லை"); return; }
        const { error } = await supabase.from('emi_records').insert([{type, month, date, name, amount, remain, bank: type==='emi'?name:''}]);
        if(error) { alert("Error: " + error.message); return; }
        alert("சேமிக்கப்பட்டது!");
        document.getElementById('amount').value = '';
        document.getElementById('name').value = '';
        document.getElementById('remain').value = '';
        loadData();
    }
    
    document.getElementById('saveBtn').onclick = saveRecord;
    document.getElementById('refreshBtn').onclick = loadData;
    loadData();
</script>
</body>
</html>
